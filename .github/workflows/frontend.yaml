name: Build and Deploy Frontend (Server)

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Generate build
        run: npm run build
      - name: Upload artifact (server files)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-server
          path: |
            .
            !node_modules
            !.git
            !.github
            !.vscode
            !.next/cache

  deploy:
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-server
          path: ./frontend-server
      
      - name: Deploy Next.js app
        run: |
          $target = "C:\deploy\davjs"
          
          # Остановка процесса
          & pm2 stop DavJS --silent
          
          if (Test-Path $target) {
            Get-ChildItem -Path $target -Exclude node_modules | Remove-Item -Recurse -Force -ErrorAction Stop
          } else {
            New-Item -ItemType Directory -Path $target -Force
          }

          # Копирование файлов
          robocopy "./frontend-server" $target /E /IS /IT /NP
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE" }

          Set-Location $target
          
          # Установка зависимостей
          npm ci --production

          # Перезапуск
          & pm2 restart DavJS
          Write-Host "DavJS restarted via PM2."
